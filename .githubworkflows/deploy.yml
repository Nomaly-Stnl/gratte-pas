# Déploie Gratte pas sur GitHub Pages à chaque push sur main.
# Chaque déploiement reçoit un numéro de build unique : les téléphones
# détectent la nouvelle version et se mettent à jour tout seuls.
name: Déployer Gratte pas

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Préparer le site avec un numéro de build
        run: |
          BUILD="$(TZ=Europe/Zurich date +%Y.%m.%d-%H%M)-${GITHUB_SHA::7}"
          echo "Build : $BUILD"
          mkdir -p _site
          cp -r index.html styles.css app.js sw.js manifest.webmanifest icons _site/
          sed -i "s/__BUILD__/${BUILD}/g" _site/sw.js _site/app.js

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
